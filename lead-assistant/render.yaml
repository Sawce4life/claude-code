# For the case where this folder is a repository on its own.
#
# When it lives inside a larger repository, Render reads the render.yaml at
# the top of that repository instead, which points back at this folder. Both
# describe the same service.
#
# The free plan sleeps when idle and has no disk, so the database would be
# wiped on every deploy. That is what the disk below is for.
services:
  - type: web
    name: lead-assistant
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /data
      - key: SESSION_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SIGNUPS
        value: open
    disk:
      name: lead-data
      mountPath: /data
      sizeGB: 1
